/**:
  ros__parameters:
    image_encoding: jpeg
    # Pi v2 (IMX219) sensor-mode=2 → 1920x1080 @ 30fps
    # flip-method=6 in nvvidconv replaces the separate videoflip element (required for NVMM buffers)
    gscam_config: "nvarguscamerasrc sensor-id=0 sensor-mode=2 ! video/x-raw(memory:NVMM),width=(int)1920,height=(int)1080,format=(string)NV12,framerate=(fraction)30/1 ! nvvidconv flip-method=6 ! video/x-raw,format=I420 ! jpegenc quality=95"
    use_gst_timestamps: False
    camera_name: front_camera
    camera_info_url: file:///opt/robomaster/front_camera.yaml
    frame_id: front_camera_frame
